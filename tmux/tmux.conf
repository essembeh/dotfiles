# screen-like behaviour with C-a
unbind C-b
bind C-b send-prefix
set -g prefix C-a

# common bindings
bind C-c new-window -c '#{pane_current_path}'
bind C-w choose-window
bind C-n next-window
bind C-p previous-window
bind C-a last-window
bind C-d detach

# splitting and sync
unbind %
bind C-v split-window -h -c '#{pane_current_path}'
bind C-h split-window -v -c '#{pane_current_path}'
bind C-s set-window-option synchronize-panes on

# copy mode
setw -g mode-keys vi
unbind [
bind Escape copy-mode
bind P paste-buffer
# vi-style selection in copy mode + copy to system clipboard (wayland: wl-copy)
# every copy lands in BOTH primary (middle-click) and clipboard (ctrl+v) so
# text flows freely between tmux and other apps
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy --primary && wl-copy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'wl-copy --primary && wl-copy'
# middle-click pastes the system primary selection into tmux, no Shift needed
bind -T root MouseDown2Pane run -b 'wl-paste --primary --no-newline | tmux load-buffer - && tmux paste-buffer -p'

# status bar
set -g status-style bg=blue,fg=white
set -g window-status-style bg=blue,fg=white
set -g window-status-current-style bg=white,fg=blue
set -g status-right '#[fg=yellow]#(uptime | cut -d "," -f3-)'
# highlight windows with activity (e.g. an agent finished in another pane)
set -g window-status-activity-style bg=red,fg=white

# truecolor: proper 24-bit color for claude code and other TUIs
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# mouse: scroll, click-to-select pane, drag-to-resize, drag-to-copy
set -g mouse on
# let tmux own the system clipboard so selections leave tmux for other apps
set -g set-clipboard on

# big scrollback for long agent/build/log output
set -g history-limit 100000

# notify when a background pane produces output (agent finished, build done)
setw -g monitor-activity on
set -g visual-activity off

# focus events: lets claude code / editors know the pane gained/lost focus
set -g focus-events on

# window/pane numbering: start at 1 and keep it contiguous after closing one
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# automatic, informative window titles
set -g set-titles on
set -g set-titles-string '#S:#I #W'
setw -g automatic-rename on

# misc options
set -s escape-time 0
set -g display-time 2000
#set-option -g default-shell /bin/zsh
